# This web service is reachable only through Caddy inside the private Docker network.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ai:10m rate=5r/m;
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  location = /api/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api;
    proxy_set_header Authorization $http_authorization;
  }
  location = /api/suggest-category {
    limit_req zone=ai burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://api;
    proxy_set_header Authorization $http_authorization;
  }
  location /api/ {
    proxy_pass http://api;
    proxy_set_header Authorization $http_authorization;
  }
  location = /phpmyadmin { return 404; }
  location /phpmyadmin/ { return 404; }
  location / { try_files $uri /index.html; }
}
